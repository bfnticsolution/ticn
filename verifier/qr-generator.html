<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Générateur de QR codes — NTIC Solution (usage interne)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #0a0a0a;
    --text-muted: #6b7280;
    --text-subtle: #9ca3af;
    --accent: #1a4dff;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
}

.container {
    max-width: 560px;
    margin: 0 auto;
}

.header {
    margin-bottom: 24px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
}

.brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.brand-mark svg {
    width: 16px;
    height: 16px;
    stroke: #ffffff;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.brand-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
}

.brand-name span {
    color: var(--accent);
}

.page-title {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
    margin-bottom: 4px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
}

.notice {
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12.5px;
    color: #78350f;
    margin-bottom: 24px;
}

.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.field input {
    width: 100%;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 13.5px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
}

.field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(26, 77, 255, 0.1);
    background: var(--surface);
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 11px 20px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    width: 100%;
}

.btn-primary {
    background: var(--text);
    color: #ffffff;
}

.btn-primary:hover {
    background: #1f1f1f;
}

.btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
}

.btn-secondary:hover {
    background: var(--bg);
}

.result {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: none;
    text-align: center;
}

.result.active {
    display: block;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

.qr-wrap {
    display: inline-block;
    padding: 16px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
}

.qr-wrap img {
    display: block;
    width: 220px;
    height: 220px;
}

.url-display {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    word-break: break-all;
    margin-bottom: 16px;
    text-align: left;
}

.actions {
    display: flex;
    gap: 8px;
}

.error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
}

.error.active {
    display: block;
}

@media (max-width: 480px) {
    .card {
        padding: 20px;
    }
    .qr-wrap img {
        width: 180px;
        height: 180px;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M20 6L9 17l-5-5"/>
                </svg>
            </div>
            <div class="brand-name">NTIC <span>Solution</span></div>
        </div>
        <p class="page-title">Générateur de QR codes pour attestations</p>
    </div>

    <div class="notice">
        Outil interne. Ne pas publier sur le site. Les QR codes générés pointent vers la page publique de vérification.
    </div>

    <div class="card">
        <div class="field">
            <label for="input-id">Identifiant de l'attestation</label>
            <input type="text" id="input-id" placeholder="NTIC/FORM/2026/09/049" autocomplete="off" spellcheck="false">
        </div>

        <button type="button" class="btn btn-primary" id="btn-generate">
            Générer le QR code
        </button>

        <div class="error" id="error" role="alert"></div>

        <div class="result" id="result">
            <div class="qr-wrap">
                <img id="qr-image" alt="QR code de vérification" width="220" height="220">
            </div>
            <div class="url-display" id="url-display"></div>
            <div class="actions">
                <button type="button" class="btn btn-secondary" id="btn-download">
                    Télécharger l'image
                </button>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    // Configuration
    const BASE_URL = 'https://nticsolution.org/verifier/?id=';
    const QR_API = 'https://api.qrserver.com/v1/create-qr-code/';

    // Références DOM
    const inputEl = document.getElementById('input-id');
    const btnGenerate = document.getElementById('btn-generate');
    const btnDownload = document.getElementById('btn-download');
    const resultEl = document.getElementById('result');
    const qrImageEl = document.getElementById('qr-image');
    const urlDisplayEl = document.getElementById('url-display');
    const errorEl = document.getElementById('error');

    // Échappement HTML
    function esc(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // Validation du format : NTIC/FORM/AAAA/MM/NNN
    function isValidId(id) {
        return /^NTIC\/FORM\/\d{4}\/\d{2}\/\d{3}$/.test(id);
    }

    function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add('active');
        resultEl.classList.remove('active');
    }

    function clearError() {
        errorEl.classList.remove('active');
        errorEl.textContent = '';
    }

    function generate() {
        clearError();

        const raw = (inputEl.value || '').trim().toUpperCase();

        if (!raw) {
            showError('Saisissez un identifiant.');
            return;
        }

        if (!isValidId(raw)) {
            showError('Format attendu : NTIC/FORM/AAAA/MM/NNN (ex. NTIC/FORM/2026/09/049).');
            return;
        }

        const verificationUrl = BASE_URL + raw;
        const qrSrc = QR_API +
            '?size=440x440' +
            '&margin=8' +
            '&format=png' +
            '&ecc=H' +
            '&color=0a0a0a' +
            '&bgcolor=ffffff' +
            '&data=' + encodeURIComponent(verificationUrl);

        qrImageEl.onload = function () {
            urlDisplayEl.textContent = verificationUrl;
            resultEl.classList.add('active');
        };

        qrImageEl.onerror = function () {
            showError('Impossible de générer le QR code. Vérifiez la connexion.');
        };

        qrImageEl.src = qrSrc;

        // Stocke l'URL pour le téléchargement
        btnDownload.dataset.url = qrSrc;
        btnDownload.dataset.filename = raw.replace(/\//g, '_') + '.png';
    }

    function download() {
        const url = btnDownload.dataset.url;
        const filename = btnDownload.dataset.filename;
        if (!url) return;

        fetch(url)
            .then(function (r) { return r.blob(); })
            .then(function (blob) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            })
            .catch(function () {
                showError('Téléchargement impossible. Faites un clic droit sur l\'image et choisissez Enregistrer.');
            });
    }

    // Événements
    btnGenerate.addEventListener('click', generate);
    btnDownload.addEventListener('click', download);

    inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            generate();
        }
    });

    // Valeur par défaut pour test rapide
    inputEl.value = 'NTIC/FORM/2026/09/049';
})();
</script>
</body>
</html>
